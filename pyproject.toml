# This file configures development tools only.
# Pussy is NOT a distributable package: clone the repository and run
# `python -m pussy` from the project root.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["pussy"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"pussy/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
packages = ["pussy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
